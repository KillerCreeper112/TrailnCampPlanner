spring.application.name=TrailnCampPlanner
spring.datasource.url=jdbc:mysql://localhost:3306/trail_n_camp
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# This tells hibernate to automatically create a database tables if needed.
# It will also tell hibernate to update the tables if any changes are made to
# the JP entities.
spring.jpa.hibernate.ddl-auto=update